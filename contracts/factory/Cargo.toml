[package]
name = "trading-account-factory"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"  # near-sdk 5.29's minimum; the toolchain itself is pinned in rust-toolchain.toml
license = "MIT"
repository = "https://github.com/beneviolabs/autonomous-trading-account"

[package.metadata.near.reproducible_build]
# Official NEAR build image, pinned by digest. Keep both crates' values identical.
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "trading_account_factory"
path = "src/lib.rs"

[dependencies]
near-sdk = { version = "5.29.1", features = ["unstable", "global-contracts"] }
hex = "0.4.3"
bs58 = "0.5"

[dev-dependencies]
# Mocked blockchain for unit tests only; keeps it out of the contract build.
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
