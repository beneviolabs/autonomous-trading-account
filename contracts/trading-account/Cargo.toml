[package]
name = "trading-account"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/beneviolabs/autonomous-trading-account"

[package.metadata.near.reproducible_build]
# Official NEAR build image, pinned by digest. Keep both crates' values identical.
image = "sourcescan/cargo-near:0.16.0-rust-1.86.0"
image_digest = "sha256:3220302ebb7036c1942e772810f21edd9381edf9a339983da43487c77fbad488"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "trading_account"
path = "src/lib.rs"

[features]
integration-tests = []


[dependencies]
near-sdk = {version = "5.17.2", default-features = false, features = ["unit-testing", "unstable", "legacy"] }
near-contract-standards = "5.17.2"
near-gas = "0.3.0"
borsh = "1.5.1"
borsh-derive = "1.5.1"
serde = { version = "1.0.214", features = ["derive"] }
omni-transaction = "0.2.1"
sha2 = "0.10.8"
serde_json = "1.0"
hex = "0.4.3"
schemars = "0.8.22"
bs58 = "0.5.1"
near-account-id = "^1.1.1"
once_cell = "1.21.3"


[dev-dependencies]
near-workspaces = "0.21.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
anyhow = "1.0"
