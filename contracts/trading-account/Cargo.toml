[package]
name = "trading-account"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"  # near-sdk 5.29's minimum; the toolchain itself is pinned in rust-toolchain.toml
license = "MIT"
repository = "https://github.com/beneviolabs/autonomous-trading-account"

[package.metadata.near.reproducible_build]
# Official NEAR build image, pinned by digest. Keep both crates' values identical.
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "trading_account"
path = "src/lib.rs"

[features]
integration-tests = []


[dependencies]
near-sdk = {version = "5.29.1", default-features = false, features = ["unstable", "legacy", "global-contracts"] }
borsh = "1.5.1"
serde = { version = "1.0.214", features = ["derive"] }
sha2 = "0.10.8"
serde_json = "1.0"
# Parses quote deadlines. Parsing only: +10.5 KB of wasm.
time = { version = "0.3.55", default-features = false, features = ["parsing"] }


[dev-dependencies]
# Mocked blockchain for unit tests only; keeps it out of the contract build.
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
near-workspaces = "0.23.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
# Compiles the stub intents.near in integration_tests.rs.
wat = "1"
# Encode code hashes and owner ids in integration_tests.rs.
bs58 = "0.5.1"
hex = "0.4.3"
# Formats the live 1Click quote's deadline in integration_tests.rs.
time = { version = "0.3.55", features = ["formatting"] }
# Broadcasts the global-contract transactions to the sandbox in integration_tests.rs. The version
# near-workspaces already uses; no TLS needed for the local RPC.
reqwest = { version = "0.12", default-features = false }
# Build the global-contract transactions near-workspaces can't send (integration_tests.rs). The
# versions near-workspaces already uses.
near-primitives = "0.37.4"
near-crypto = "0.37.4"
