# Both contracts build from one workspace with a single Cargo.lock, so they always agree on
# dependency versions. Each member still builds its own wasm (cargo near builds one package
# at a time), so their different near-sdk feature sets don't leak into each other's wasm.
#
# Shared code: add a library crate here (e.g. `common`) and depend on it by path from both
# contracts. Keep it to plain types/helpers; it must not define a #[near] contract.
[workspace]
resolver = "2"
members = ["trading-account", "factory"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.test]
# near-sdk's mocked blockchain trips Rust's debug-only pointer precondition check.
debug-assertions = false
