name: contracts

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt + clippy).
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install cargo-near
        # Keep in sync with CARGO_NEAR_VERSION in scripts/build-wasm.sh.
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.16.0/cargo-near-installer.sh | sh

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run formatting check
        run: make fmt-check

      - name: Run clippy
        run: make clippy

      - name: Run tests
        run: make test-unit

      - name: Security audit
        run: make audit

      - name: Build contracts (reproducible)
        # Builds inside NEAR's pinned image (see [package.metadata.near.reproducible_build]).
        # The printed hashes are reproducible by anyone with `make release` on this commit.
        run: make release

      - name: Contract size check
        run: |
          MAX_SIZE=4194304
          SIZE=$(stat -c%s contracts/target/near/trading_account/trading_account.wasm)
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Contract size $SIZE exceeds NEAR limit $MAX_SIZE"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            contracts/target/near/trading_account/trading_account.wasm
            contracts/target/near/trading_account_factory/trading_account_factory.wasm

      - name: Dependency vulnerability scan
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          # time (RUSTSEC-2026-0009): the fix needs Rust 1.88 and time never reaches the
          # contract wasm. Mirrors contracts/.cargo/audit.toml.
          allow-ghsas: GHSA-r6v5-fh4h-64xc
