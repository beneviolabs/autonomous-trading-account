name: contracts

on:
  workflow_dispatch:
  push:
    # PR branches are covered by pull_request; without this filter every push runs twice.
    branches: [ main ]
    # Release tags (docs/releases.md). Path filters don't apply to tag pushes.
    tags: [ 'trading-account/v*' ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  # Lint, tests and audit. Runs in parallel with the reproducible build below.
  test:
    runs-on: ubuntu-latest

    env:
      # Keep in sync with near-sandbox's DEFAULT_NEAR_SANDBOX_VERSION (pulled in by near-workspaces).
      NEAR_SANDBOX_VERSION: "2.13.4"

    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt + clippy).
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install cargo-near
        # Keep in sync with CARGO_NEAR_VERSION in scripts/build-wasm.sh.
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # The sandbox integration tests otherwise download neard on every run without a Rust-cache hit.
      - name: Cache NEAR sandbox
        id: sandbox-cache
        uses: actions/cache@v4
        with:
          path: ~/near-sandbox
          key: near-sandbox-${{ runner.os }}-${{ env.NEAR_SANDBOX_VERSION }}

      - name: Download NEAR sandbox
        if: steps.sandbox-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/near-sandbox
          curl --proto '=https' --tlsv1.2 -LsSf "https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/${NEAR_SANDBOX_VERSION}/near-sandbox.tar.gz" \
            | tar -xz -C ~/near-sandbox
          mv "$(find ~/near-sandbox -type f -name near-sandbox | head -1)" ~/near-sandbox/near-sandbox.bin
          chmod +x ~/near-sandbox/near-sandbox.bin

      - name: Use cached NEAR sandbox
        run: echo "NEAR_SANDBOX_BIN_PATH=$HOME/near-sandbox/near-sandbox.bin" >> "$GITHUB_ENV"

      - name: Run formatting check
        run: make fmt-check

      - name: Run clippy
        run: make clippy

      # Unit tests, then a dev build and the sandbox integration tests.
      - name: Run tests
        run: make test

      - name: Security audit
        run: make audit

      - name: Dependency vulnerability scan
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          # rustls (RUSTSEC-2026-0285): test-only, and near-sdk 5.29.1 caps it below the fix.
          # Mirrors contracts/.cargo/audit.toml.
          allow-ghsas: GHSA-2mjx-qc3c-rqvc

  # Reproducible release build in NEAR's pinned Docker image. Needs no Rust cache.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-near
        # Keep in sync with CARGO_NEAR_VERSION in scripts/build-wasm.sh.
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh

      - name: Build contracts (reproducible)
        # Builds inside NEAR's pinned image (see [package.metadata.near.reproducible_build]).
        # The printed hashes are reproducible by anyone with `make release` on this commit.
        run: make release

      - name: Contract size check
        run: |
          MAX_SIZE=4194304
          for wasm in contracts/target/near/*/*.wasm; do
            SIZE=$(stat -c%s "$wasm")
            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "$wasm is $SIZE bytes, over NEAR's $MAX_SIZE limit"
              exit 1
            fi
          done

      # Release builds: pushes to main, release tags, plus manual runs (use a manual run on a
      # branch only for testnet rehearsals). Mainnet releases come from commits on main.
      - name: Upload build artifacts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            contracts/target/near/trading_account/trading_account.wasm
            contracts/target/near/trading_account_factory/trading_account_factory.wasm

  # A release tag publishes the trading account's wasm as a GitHub Release, once the tests and the
  # reproducible build pass (docs/releases.md#versions).
  release:
    if: startsWith(github.ref, 'refs/tags/trading-account/v')
    needs: [ test, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release

    steps:
      - uses: actions/checkout@v4
        with:
          # Every release tag, to check this one is the newest.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: wasm

      # One version, one hash: the tag must be on main, name its commit's CONTRACT_VERSION and be
      # the newest release. Creating the Release fails if one already exists for this tag.
      - name: Check the tag
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main"
            exit 1
          fi
          version=$(sed -nE 's/^const CONTRACT_VERSION: &str = "([^"]+)";.*/\1/p' contracts/trading-account/src/lib.rs)
          if [ "$GITHUB_REF_NAME" != "trading-account/v$version" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match CONTRACT_VERSION $version"
            exit 1
          fi
          newest=$(git tag -l 'trading-account/v*' --sort=-v:refname | head -1)
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$newest is newer than $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wasm=wasm/trading_account/trading_account.wasm
          hex=$(sha256sum "$wasm" | cut -d' ' -f1)
          # The bs58 form is what deploy-as-global prints and set_global_code_hash takes.
          bs58=$(python3 -c '
          import sys
          digest = bytes.fromhex(sys.argv[1])
          n = int.from_bytes(digest, "big")
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          out = ""
          while n:
              n, r = divmod(n, 58)
              out = alphabet[r] + out
          print("1" * (len(digest) - len(digest.lstrip(b"\0"))) + out)
          ' "$hex")
          gh release create "$GITHUB_REF_NAME" "$wasm" --verify-tag \
            --title "Trading account ${GITHUB_REF_NAME#trading-account/v}" \
            --notes "Built reproducibly from $GITHUB_SHA by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.

          SHA-256 (hex): \`$hex\`
          SHA-256 (bs58): \`$bs58\`"
